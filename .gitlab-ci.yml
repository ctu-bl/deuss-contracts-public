    - job: deploy-contracts:dev
      artifacts: true
  variables:
    BESU_DEPLOY_ENV: dev
    BESU_RPC_URL: $BESU_NET_RPC_URL
    BESU_NETWORK_ID: $BESU_NET_ID
    BESU_DEPLOYER_PRIVATE_KEY: $BESU_DEV_DEPLOYER_PRIVATE_KEY
    BESU_TIMELOCK_ADMIN_PRIVATE_KEY: $BESU_DEV_TIMELOCK_ADMIN_PRIVATE_KEY
    BESU_TIMELOCK_ACTOR_PRIVATE_KEY: $BESU_DEV_TIMELOCK_ACTOR_PRIVATE_KEY
    BESU_ADMIN_PRIVATE_KEY: $BESU_DEV_ADMIN_PRIVATE_KEY

mock-data:test:
  extends: .mock-data
  needs:
    - job: deploy-contracts:test
      artifacts: true
  variables:
    BESU_DEPLOY_ENV: test
    BESU_RPC_URL: $BESU_NET_RPC_URL
    BESU_NETWORK_ID: $BESU_NET_ID
    BESU_DEPLOYER_PRIVATE_KEY: $BESU_TEST_DEPLOYER_PRIVATE_KEY
    BESU_TIMELOCK_ADMIN_PRIVATE_KEY: $BESU_TEST_TIMELOCK_ADMIN_PRIVATE_KEY
    BESU_TIMELOCK_ACTOR_PRIVATE_KEY: $BESU_TEST_TIMELOCK_ACTOR_PRIVATE_KEY
    BESU_ADMIN_PRIVATE_KEY: $BESU_TEST_ADMIN_PRIVATE_KEY

########################################
# 🚀 Stage: docs
# Generated documentation to https://bebi.ebsi.fel.cvut.cz/bond-contract/ and signatures
.deploy-docs:
  stage: docs
  needs:
    - job: build
      artifacts: true
  variables:
    FOUNDRY_DOC_REPOSITORY: $CI_PROJECT_URL
    SITE_URL: https://bebi.ebsi.fel.cvut.cz/bond-contract
  script:
    # Fix absolute paths because forge doesn't respect mdbook's site-url.
    - find .tmp/docs/book -name '*.html' -exec sed -i "s|<a href=\"/|&${CI_PROJECT_PATH#*/}/|g" {} \;
    - mv .tmp/docs/book public
    - cp .sites-fel.yml public/
  artifacts:
    paths:
      - public/
    expire_in: 1 hour

deploy-docs:master:
  extends: .deploy-docs
  only:
    - master
  environment:
    name: docs/master
    url: $SITE_URL/

deploy-docs:dev:
  extends: .deploy-docs
  except:
    - master
  environment:
    name: docs/$CI_COMMIT_REF_SLUG
    url: $SITE_URL/@$CI_COMMIT_REF_SLUG/
    on_stop: deploy-docs:dev-stop

# This job is triggered when a merge request is closed to mark the associated
# environment as "stopped".
deploy-docs:dev-stop:
  stage: docs
  when: manual
  except:
    - master
  variables:
    GIT_STRATEGY: none
  script:
    - "true"
  environment:
    name: docs/$CI_COMMIT_REF_SLUG
    action: stop

generate-selector-docs:
  extends: .with-soldeer-deps
  stage: docs
  needs:
    - job: build
      artifacts: true
  script:
    - python3 tools/ci/generate_selector_docs.py --format json --out signatures/
  artifacts:
    paths:
      - signatures/
    expire_in: 1 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_NAME =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - when: never

########################################
# 🚀 Stage: export
# Export abis, signatures and contract addresses
deployment-export:
  stage: export
  needs:
    - job: build
      artifacts: true
    - job: deploy-contracts:dev
      artifacts: true
    - job: deploy-contracts:test
      artifacts: true
    - job: deploy-contracts:demo
      artifacts: true
    - job: generate-selector-docs
      artifacts: true
  before_script:
    - eval "$(ssh-agent -s)"
    - chmod 600 "$SSH_PRIV_KEY"
    - ssh-add "$SSH_PRIV_KEY"
    - mkdir -p ~/.ssh
  script:
    - ssh-keyscan gitlab.nesad.fit.vutbr.cz >> ~/.ssh/known_hosts
    - git config --global user.name "Bond Contract CI"
    - git config --global user.email "no-reply@deuss.eu"
    - git clone gitlab@gitlab.nesad.fit.vutbr.cz:bebi/onchain-core/sc-deployment-export.git export-abi
    - rm -rf export-abi/abis/* export-abi/signatures/*
    - find out/ -type f -name '*.json' -exec sh -c 'abi=$(jq -e ".abi | select(type == \"array\" and length > 0)" "$1") || exit 0; echo "$abi" > "export-abi/abis/$(basename "$1")"' _ {} \;
    - find deployments/ -type f -name "*_latest.json" -exec cp {} export-abi/ \;
    - cp -rf "signatures/" "export-abi/"
    - cd export-abi
    - |
      if [ -z "$(git status --porcelain)" ]; then
        exit 0; # no changes, exit with success
      fi
    - git add --all
    - git commit -m "update ABI and deployment addresses [CI]"
    - git push origin master
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_NAME =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - when: never

# This jobs builds docker container which contains anvil and deploys smart contracts. It is mainly used by BE offchain developers.
build-docker-image:
  image: docker:dind
  cache: [ ]
  needs:
    - job: build
      artifacts: true
    - job: test-solidity
    - job: lint-slither
    - job: lint-solhint
  services:
    - docker:dind
  stage: export
  variables:
    DOCKER_BUILD_LABEL: "latest"
    DOCKER_BUILD_OPTS: "--network=host"
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    CUSTOM_IMG_NAME: "bond-contract"
    DOCKER_FILE: "dockerfiles/Dockerfile.development"
  script:
    - VERSION="${CI_COMMIT_TAG#*@}"
    - |
      if [ -n "$VERSION" ] ; then
          DOCKER_BUILD_LABEL="${VERSION}"
      elif [ -n "$CUSTOM_TAG" ] ; then
          DOCKER_BUILD_LABEL="${CUSTOM_TAG}"
      fi
    - echo "Using tag ${DOCKER_BUILD_LABEL} as custom label"
    - echo "Using ${DOCKER_BUILD_OPTS} as extra arguments to docker build command"
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker buildx create --name ci-builder --driver docker-container --bootstrap --use
    - CACHE_IMAGE="${CI_REGISTRY_IMAGE}/${CUSTOM_IMG_NAME}:${CUSTOM_TAG}"
    - |
      if [ -n "$CUSTOM_TAG" ] ; then
          docker pull "${CACHE_IMAGE}" || true
          CACHE_FROM_ARG="--cache-from ${CACHE_IMAGE}"
      else
          CACHE_FROM_ARG=""
      fi
      TAG_ARGS="-t ${CI_REGISTRY_IMAGE}/${CUSTOM_IMG_NAME}:${CI_COMMIT_SHORT_SHA}"
      if [ "${DOCKER_BUILD_LABEL}" != "${CI_COMMIT_SHORT_SHA}" ] ; then
          TAG_ARGS="${TAG_ARGS} -t ${CI_REGISTRY_IMAGE}/${CUSTOM_IMG_NAME}:${DOCKER_BUILD_LABEL}"
      fi
      docker buildx build --push --target runtime --provenance=false --sbom=false ${DOCKER_BUILD_OPTS} -f ./${DOCKER_FILE} ${CACHE_FROM_ARG} --build-arg CI_JOB_TOKEN=${CI_JOB_TOKEN} ${TAG_ARGS} .
    # Registry attestation manifests (--provenance/--sbom) break tags on this GitLab instance's
    # container registry ("Invalid tag: missing manifest digest"), so SBOM/provenance are
    # generated as plain CI artifacts instead of OCI attestations.
    - IMAGE_REF="${CI_REGISTRY_IMAGE}/${CUSTOM_IMG_NAME}:${CI_COMMIT_SHORT_SHA}"
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
    - syft registry:${IMAGE_REF} -o cyclonedx-json=sbom.json
    - |
      cat > provenance.json <<EOF
      {
        "image": "${IMAGE_REF}",
        "commit": "${CI_COMMIT_SHA}",
        "ref": "${CI_COMMIT_REF_NAME}",
        "dockerfile": "${DOCKER_FILE}",
        "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
        "pipelineUrl": "${CI_PIPELINE_URL}",
        "jobUrl": "${CI_JOB_URL}",
        "projectUrl": "${CI_PROJECT_URL}",
        "runner": "${CI_RUNNER_DESCRIPTION} (#${CI_RUNNER_ID})"
      }
      EOF
    - docker logout ${CI_REGISTRY}
  artifacts:
    when: always
    paths:
      - sbom.json
      - provenance.json
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never
  