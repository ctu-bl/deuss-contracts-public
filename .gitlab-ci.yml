# Run MR pipeline when MR exists (skip duplicate branch pipeline).
# Run branch pipeline when no MR is open. Always run on tags.
workflow:
  rules:
    # Always allow scheduled pipelines (weekly fuzz smoke, nightly full on master).
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - when: always

default:
  image:
    name: $CI_REGISTRY_IMAGE/foundry-ci:latest
    entrypoint: [""]
    docker:
      user: root

stages:
  - images
  - build
  - test
  - fuzz
  - deploy
  - verify
  - mock
  - docs
  - export

########################################
# 🚀 Stage: images
# Build and push custom CI image (only when Dockerfile.ci changes)
build-ci-image:
  stage: images
  image: docker:dind
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $CI_REGISTRY_IMAGE/foundry-ci:latest || true
    - DOCKER_BUILDKIT=1 docker build --provenance=false --sbom=false --cache-from $CI_REGISTRY_IMAGE/foundry-ci:latest -f Dockerfile.ci -t $CI_REGISTRY_IMAGE/foundry-ci:latest .
    - docker push $CI_REGISTRY_IMAGE/foundry-ci:latest
  rules:
    - changes:
        - Dockerfile.ci

.with-soldeer-deps:
  cache: &soldeer-cache
    key:
      files:
        - foundry.toml
        - soldeer.lock
    paths:
      - dependencies/
    policy: pull
  before_script:
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.nesad.fit.vutbr.cz".insteadOf "https://gitlab.nesad.fit.vutbr.cz"
    - forge soldeer install

########################################
# 🚀 Stage: build
# Run build smart contracts
build:
  stage: build
  # Compiling this project runs solc through the Yul IR pipeline
  # (`via-ir = true` in foundry.toml), which needs a lot of RAM — and it is
  # a single solc process, so the work cannot be spread over parallel jobs.
  # The `bigmem` runners are provisioned for exactly this; every job that
  # compiles the contracts asks for them.
  tags:
    - bigmem
  before_script:
    - !reference [.with-soldeer-deps, before_script]
    - mkdir -p deployments
  script:
    - forge build
    - forge doc --build --out .tmp/docs
    - |
      find src -name '*.sol' -exec basename {} \; | sort -u > .tmp/src-artifact-names
      for dir in out/*; do
        [ -d "$dir" ] || continue
        base="$(basename "$dir")"
        grep -qxF "$base" .tmp/src-artifact-names || rm -rf "$dir"
      done
  cache:
    <<: *soldeer-cache
    policy: pull-push
  artifacts:
    paths:
      - out/
      - deployments/
      - .tmp/docs/
    expire_in: 7 days

########################################
# 🚀 Stage: test
# Run unit tests, coverage, and linters
.default-python:
  extends: .with-soldeer-deps
  before_script:
    - !reference [.with-soldeer-deps, before_script]
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install --no-cache-dir --upgrade pip

test-solidity:
  stage: test
  tags:
    - bigmem
  dependencies:
    - build
  extends: .default-python
  script:
    - pip install --no-cache-dir lcov_cobertura
    - python3 tools/ci/test_coverage_changed_files.py
    - forge coverage --report summary --report lcov
    - lcov_cobertura lcov.info -o coverage.xml
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch --no-tags origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        python3 tools/ci/coverage_changed_files.py \
          --lcov lcov.info \
          --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" \
          --threshold 90
      else
        echo "Not a merge-request pipeline; skipping changed-file coverage gate."
      fi
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

lint-slither:
  stage: test
  tags:
    - bigmem
  dependencies:
      - build
  extends: .default-python
  script:
    - pip install --no-cache-dir slither-analyzer
    - slither . --filter-paths 'dependencies/|test/|script/' --json slither-output.json --fail-high --skip-assembly
    - impact="$(./tools/ci/slither-json-highest-impact slither-output.json)" && echo "Highest impact is $impact"
    - |
      case "$impact" in
        Medium) exit 250 ;;
      esac
  allow_failure:
      exit_codes: 250  # allow impact up to Medium to soft-fail
  after_script:
      - ./tools/ci/slither-json-to-gitlab slither-output.json > slither-code-quality.json
  artifacts:
    when: always
    reports:
      codequality: slither-code-quality.json

# Deep symbolic analysis with Mythril
sec-mythril:
  stage: test
  tags:
    - bigmem
  timeout: 2h
  dependencies:
    - build
  extends: .default-python
  script:
    - pip install --no-cache-dir "setuptools<81" mythril
    - ./tools/ci/mythril-analyze.sh
  artifacts:
    when: always
    paths:
      - mythril-report.json
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never

lint-solhint:
  image: node:20-bullseye
  stage: test
  dependencies:
      - build
  cache:
    <<: *soldeer-cache
    policy: pull
  before_script:
    # Install JS deps deterministically if package-lock.json exists, fallback otherwise
    - |
      if [ -f package-lock.json ]; then
        npm ci --no-fund
      else
        npm install --no-fund
      fi
  script:
    - mkdir -p .tmp
    - npx solhint --disc --max-warnings 0 'src/**/*.sol'
    - npx solhint --disc -c .solhint.t.json 'test/**/*.sol'
    - npx solhint --disc -c .solhint.s.json 'script/**/*.sol'
  after_script:
    - mkdir -p .tmp
    - npx solhint --disc -f json 'src/**/*.sol' > .tmp/solhint-src.json || true
    - npx solhint --disc -f json -c .solhint.t.json 'test/**/*.sol' > .tmp/solhint-test.json || true
    - npx solhint --disc -f json -c .solhint.s.json 'script/**/*.sol' > .tmp/solhint-script.json || true
    - ./tools/ci/solhint-json-to-gitlab .tmp/solhint-*.json > solhint-code-quality.json
  artifacts:
    when: always
    reports:
      codequality: solhint-code-quality.json

gitleaks:
  image:
    name: zricethezav/gitleaks:v8.18.4
    entrypoint: [""]
  stage: test
  dependencies: []
  script:
    - gitleaks detect --source . --no-banner --redact --exit-code 1 --report-format json --report-path gitleaks-report.json
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 7 days

########################################
# Stage: fuzz
# Scheduled Echidna and Medusa campaigns (RQ_SEC_FUZZ acceptance: smoke-pass on a
# schedule, weekly OK; full campaign nightly on main).
#
# GitLab cannot express cron in YAML, so create the schedules in
# Settings > CI/CD > Schedules and pass FUZZ_CAMPAIGN as a schedule variable:
#   1. Weekly smoke - cron "0 0 * * 1" (Mon 00:00), target the maintained branch,
#                     variable FUZZ_CAMPAIGN=smoke.
#   2. Nightly full - cron "0 2 * * *", target branch master,
#                     variable FUZZ_CAMPAIGN=full.
# The full campaign only runs on master (see rules below); a FUZZ_CAMPAIGN=full
# schedule on any other branch is downgraded to the smoke campaign. For an
# on-demand run use "Run pipeline" (web) with RUN_FUZZ=1, optionally FUZZ_CAMPAIGN=full.
.fuzz-docker:
  stage: fuzz
  tags:
    - bigmem
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - job: build
      artifacts: true
  dependencies:
    - build
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    FUZZ_CAMPAIGN: smoke
  cache:
    <<: *soldeer-cache
    policy: pull
  before_script:
    - apk add --no-cache bash nodejs npm
    - docker version
  rules:
    # Nightly full campaign: scheduled, FUZZ_CAMPAIGN=full, master only.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FUZZ_CAMPAIGN == "full" && $CI_COMMIT_REF_NAME == "master"'
      when: on_success
    # FUZZ_CAMPAIGN=full requested off master: downgrade to the smoke campaign.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FUZZ_CAMPAIGN == "full"'
      variables:
        FUZZ_CAMPAIGN: smoke
      when: on_success
    # Weekly smoke campaign (and any other scheduled run defaults to smoke).
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    # On-demand manual run via "Run pipeline".
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_FUZZ == "1"'
      when: on_success
    - when: never

fuzz:echidna:
  extends: .fuzz-docker
  variables:
    ECHIDNA_CONTAINER_NAME: deuss-echidna-${CI_PIPELINE_ID}-${CI_JOB_ID}
    ECHIDNA_CPUS: 2
    ECHIDNA_MEMORY: 12g
    ECHIDNA_LOG_DIR: logs/fuzzing
    ECHIDNA_COVERAGE_DIR: echidna-coverage
  script:
    - |
      if [ "${FUZZ_CAMPAIGN}" = "full" ]; then
        npm run echidna
      else
        npm run echidna -- --disable-slither --test-limit 10000 --shrink-limit 1000
      fi
  artifacts:
    when: always
    paths:
      - logs/fuzzing/
      - echidna-coverage/
      - echidna-corpus/
    expire_in: 14 days

fuzz:medusa:
  extends: .fuzz-docker
  variables:
    MEDUSA_IMAGE: deuss-medusa:${CI_PIPELINE_ID}-${CI_JOB_ID}
    MEDUSA_CPUS: 2
    MEDUSA_MEMORY: 10g
  script:
    - |
      if [ "${FUZZ_CAMPAIGN}" = "full" ]; then
        npm run medusa
      else
        npm run medusa -- --test-limit 1 --use-slither=false
      fi
  artifacts:
    when: always
    paths:
      - medusa-corpus/
    expire_in: 14 days

########################################
# 🚀 Stage: deploy
# Deploy contracts
.deploy-contracts:
  extends: .with-soldeer-deps
  stage: deploy
  dependencies:
    - build
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
  script:
    - make "${DEPLOY_MAKE_TARGET:-setup_full}" NETWORK=besu
  artifacts:
    paths:
      - deployments/
      - broadcast/
      - cache/
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_NAME =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - when: never

deploy-contracts:dev:
  extends: .deploy-contracts
  variables:
    BESU_DEPLOY_ENV: dev
    BESU_RPC_URL: $BESU_NET_RPC_URL
    BESU_NETWORK_ID: $BESU_NET_ID
    BESU_DEPLOYER_PRIVATE_KEY: $BESU_DEV_DEPLOYER_PRIVATE_KEY
    BESU_TIMELOCK_ADMIN_PRIVATE_KEY: $BESU_DEV_TIMELOCK_ADMIN_PRIVATE_KEY
    BESU_TIMELOCK_ACTOR_PRIVATE_KEY: $BESU_DEV_TIMELOCK_ACTOR_PRIVATE_KEY
    BESU_ADMIN_PRIVATE_KEY: $BESU_DEV_ADMIN_PRIVATE_KEY

deploy-contracts:test:
  extends: .deploy-contracts
  variables:
    BESU_DEPLOY_ENV: test
    BESU_RPC_URL: $BESU_NET_RPC_URL
    BESU_NETWORK_ID: $BESU_NET_ID
    BESU_DEPLOYER_PRIVATE_KEY: $BESU_TEST_DEPLOYER_PRIVATE_KEY
    BESU_TIMELOCK_ADMIN_PRIVATE_KEY: $BESU_TEST_TIMELOCK_ADMIN_PRIVATE_KEY
    BESU_TIMELOCK_ACTOR_PRIVATE_KEY: $BESU_TEST_TIMELOCK_ACTOR_PRIVATE_KEY
    BESU_ADMIN_PRIVATE_KEY: $BESU_TEST_ADMIN_PRIVATE_KEY

deploy-contracts:demo:
  extends: .deploy-contracts
  variables:
    BESU_DEPLOY_ENV: demo
    BESU_RPC_URL: $BESU_NET_RPC_URL
    BESU_NETWORK_ID: $BESU_NET_ID
    BESU_DEPLOYER_PRIVATE_KEY: $BESU_DEMO_DEPLOYER_PRIVATE_KEY
    BESU_TIMELOCK_ADMIN_PRIVATE_KEY: $BESU_DEMO_TIMELOCK_ADMIN_PRIVATE_KEY
    BESU_TIMELOCK_ACTOR_PRIVATE_KEY: $BESU_DEMO_TIMELOCK_ACTOR_PRIVATE_KEY
    BESU_ADMIN_PRIVATE_KEY: $BESU_DEMO_ADMIN_PRIVATE_KEY

########################################
# 🚀 Stage: Verify
# Verify already-deployed contracts on Blockscout (retryable, no redeployment)
.verify-contracts:
  extends: .with-soldeer-deps
  stage: verify
  allow_failure: true
  script:
    - make verify_contracts NETWORK=besu
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_NAME =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - when: never

verify-contracts:dev:
  extends: .verify-contracts
  needs:
    - job: deploy-contracts:dev
      artifacts: true
  variables:
    BESU_DEPLOY_ENV: dev
    BESU_RPC_URL: $BESU_NET_RPC_URL
    BESU_NETWORK_ID: $BESU_NET_ID
    BESU_DEPLOYER_PRIVATE_KEY: $BESU_DEV_DEPLOYER_PRIVATE_KEY
    BESU_TIMELOCK_ADMIN_PRIVATE_KEY: $BESU_DEV_TIMELOCK_ADMIN_PRIVATE_KEY
    BESU_TIMELOCK_ACTOR_PRIVATE_KEY: $BESU_DEV_TIMELOCK_ACTOR_PRIVATE_KEY
    BESU_ADMIN_PRIVATE_KEY: $BESU_DEV_ADMIN_PRIVATE_KEY
    BESU_VERIFIER_URL: $VERIFIER_URL

verify-contracts:test:
  extends: .verify-contracts
  needs:
    - job: deploy-contracts:test
      artifacts: true
  variables:
    BESU_DEPLOY_ENV: test
    BESU_RPC_URL: $BESU_NET_RPC_URL
    BESU_NETWORK_ID: $BESU_NET_ID
    BESU_DEPLOYER_PRIVATE_KEY: $BESU_TEST_DEPLOYER_PRIVATE_KEY
    BESU_TIMELOCK_ADMIN_PRIVATE_KEY: $BESU_TEST_TIMELOCK_ADMIN_PRIVATE_KEY
    BESU_TIMELOCK_ACTOR_PRIVATE_KEY: $BESU_TEST_TIMELOCK_ACTOR_PRIVATE_KEY
    BESU_ADMIN_PRIVATE_KEY: $BESU_TEST_ADMIN_PRIVATE_KEY
    BESU_VERIFIER_URL: $VERIFIER_URL

verify-contracts:demo:
  extends: .verify-contracts
  needs:
    - job: deploy-contracts:demo
      artifacts: true
  variables:
    BESU_DEPLOY_ENV: demo
    BESU_RPC_URL: $BESU_NET_RPC_URL
    BESU_NETWORK_ID: $BESU_NET_ID
    BESU_DEPLOYER_PRIVATE_KEY: $BESU_DEMO_DEPLOYER_PRIVATE_KEY
    BESU_TIMELOCK_ADMIN_PRIVATE_KEY: $BESU_DEMO_TIMELOCK_ADMIN_PRIVATE_KEY
    BESU_TIMELOCK_ACTOR_PRIVATE_KEY: $BESU_DEMO_TIMELOCK_ACTOR_PRIVATE_KEY
    BESU_ADMIN_PRIVATE_KEY: $BESU_DEMO_ADMIN_PRIVATE_KEY
    BESU_VERIFIER_URL: $VERIFIER_URL

########################################
# 🚀 Stage: Mock data
.mock-data:
  extends: .with-soldeer-deps
  stage: mock
  allow_failure: true
  script:
    - make mock_data NETWORK=besu
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_NAME =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - when: never

mock-data:dev:
  extends: .mock-data
