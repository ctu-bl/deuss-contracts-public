  '''(?i)\b(?:ANVIL_)?TOKEN_RECIPIENT\b\s*:?=\s*0x[a-f0-9]{40}\b''',
  '''(?i)\btokenAddress\b\s*=\s*['"]?0x[a-f0-9]{40}['"]?;?''',
